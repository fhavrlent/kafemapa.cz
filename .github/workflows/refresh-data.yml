name: Aktualizace dat z OSM

# Nasazení dělá Cloudflare Workers Builds při každém pushi do main,
# takže tady stačí data stáhnout a commitnout.
on:
  schedule:
    - cron: '17 3 * * 1' # každé pondělí ve 3:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run data
      - name: Commit, pokud se data změnila
        run: |
          if git diff --quiet data/; then
            echo "Data beze změn."
            exit 0
          fi
          git config user.name "kafemapa-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Aktualizace dat z OSM ($(date -u +%Y-%m-%d))"
          git push
