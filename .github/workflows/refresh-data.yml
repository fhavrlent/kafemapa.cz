name: Aktualizace dat z OSM

# Nasazení dělá Cloudflare Workers Builds při každém pushi do main,
# takže tady stačí data stáhnout a commitnout. Když se data nezmění, nic se nenasazuje.
# Selhání (Overpass nedostupný, podezřelý úbytek dat) pošle GitHub e-mailem.
on:
  schedule:
    - cron: '17 3 * * *' # každý den ve 3:17 UTC (5:17 letního času)
  workflow_dispatch:
    inputs:
      force:
        description: 'Propustit i velký úbytek dat (FORCE=1)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
      - run: npm run data
        env:
          FORCE: ${{ inputs.force && '1' || '' }}
      # Stejný build jako na Cloudflare (včetně kontroly odkazů): rozbitá data se nedostanou do main.
      - run: npm run build
      - name: Commit, pokud se data změnila
        run: |
          if git diff --quiet data/; then
            echo "Data beze změn."
            exit 0
          fi
          git config user.name "kafemapa-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Aktualizace dat z OSM ($(date -u +%Y-%m-%d))"
          git push
