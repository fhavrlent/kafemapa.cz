name: Nasazení

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1' # každé pondělí ve 3:17 UTC aktualizace dat z OSM
  workflow_dispatch:
    inputs:
      refresh_data:
        description: 'Stáhnout čerstvá data z OSM'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm test

      # Commit přes GITHUB_TOKEN nespouští další workflow, proto data
      # obnovujeme i nasazujeme v jednom běhu.
      - name: Aktualizace dat z OSM
        if: github.event_name == 'schedule' || inputs.refresh_data
        run: |
          npm run data
          if git diff --quiet data/; then
            echo "Data beze změn."
          else
            git config user.name "kafemapa-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "Aktualizace dat z OSM ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Konfigurace (klíč Mapy.com ze secretu)
        env:
          MAPY_API_KEY: ${{ secrets.MAPY_API_KEY }}
        run: node -e "require('fs').writeFileSync('assets/config.js', 'export const MAPY_API_KEY = ' + JSON.stringify(process.env.MAPY_API_KEY || '') + ';\n')"

      - name: Sestavení webu
        run: |
          mkdir _site
          cp -r index.html favicon.svg icon-512.png og-image.png manifest.webmanifest robots.txt sitemap.xml CNAME assets data _site/
          rm -f _site/assets/config.example.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
