name: Kontrola kódu

# Při každém pushi a pull requestu: testy a kontrola typů JavaScriptu (TypeScript jen kontroluje,
# nic nekompiluje). Nasazení na Cloudflare na tomhle nezávisí, chyba ale přijde e-mailem.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
