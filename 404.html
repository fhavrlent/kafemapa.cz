<!doctype html>
<html lang="cs">
<head>

  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/fonts/fonts.css">
  <style>
    :root { --bg: #f6efe6; --ink: #2a1c15; --ink-2: #6b5a4e; --accent: #b5652b; }

    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 16px/1.5 Inter, system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
    img { width: 64px; height: 64px; }
    h1 { font: 700 34px/1.2 Fraunces, Georgia, serif; margin: 20px 0 8px; }
    p { color: var(--ink-2); margin: 0 0 24px; }
    a { display: inline-block; padding: 12px 20px; border-radius: 12px; background: var(--accent); color: #fff; font-weight: 600; text-decoration: none; }
  </style>
  <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "0e1d42365ab846fdb996803ff6628e9a"}'></script>

  <main>
    <img src="/favicon.svg" alt="">
    <h1>Tady kafe nevaříme</h1>
